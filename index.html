<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div id="wrapper">
        <header>
            <div class="header-title">
                <h2 class="header-text">The great RGB game</h2>
            </div>
            <div class="header-rgb-color">
                <h1 class="rgb-numbers"></h1>
            </div>
        </header>

        <section class="operations">
            <div class="levels-controller">
                <!-- <button class="btn new-game">New Colors</button> -->
                <button class="btn level hard">Hard</button>
                <button class="btn level medium">Medium</button>
                <button class="btn level easy">Easy</button>
            </div>
        </section>

        <main class="container">
            <div class="container-boxes">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </main>

        <footer>
            <p class="footer-copyright">JSN &#169; <span class="footer-year">2025</span></p>
            <ul class="footer-links">
                <div class="footer-links__link">Github</div>
                <div class="footer-links__link">Linkedin</div>
            </ul>
        </footer>
    </div>

    <script src="scripto.js"></script>
</body>

</html>
